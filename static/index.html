<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Corporativo IA</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    .container { width: 100%; max-width: 820px; }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 28px; }

    .questions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }
    .question-btn {
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1.45;
      transition: all 0.18s ease;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .question-btn:hover {
      background: var(--panel-2);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .question-btn .num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chatbox {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .chatbox-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chatbox-header .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #4ade80;
    }
    #chat {
      padding: 20px;
      min-height: 160px;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #0f172a; border-bottom-right-radius: 4px; }
    .msg.agent { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
    .tools-used { font-size: 0.75rem; color: var(--muted); margin-top: 8px; opacity: 0.85; }
    .tools-used .tag {
      display: inline-block;
      background: rgba(129, 140, 248, 0.18);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 20px;
      margin-right: 5px;
    }
    .loading { align-self: center; color: var(--muted); font-style: italic; }
    .input-row { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #send:hover { opacity: 0.9; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .chart-container {
      margin-top: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .chart-container .chart-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .chart-container svg { width: 100%; height: auto; display: block; }
    .chart-container .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .chart-container .legend-item { display: flex; align-items: center; gap: 6px; }
    .chart-container .legend-swatch {
      width: 12px; height: 12px; border-radius: 3px; display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Assistente Corporativo IA</h1>
    <p class="subtitle">Análise de indicadores de produtividade e retrabalho</p>

    <div class="questions" id="questions"></div>

    <div class="chatbox">
      <div class="chatbox-header"><span class="dot"></span> Conversa com o agente</div>
      <div id="chat"></div>
      <div class="input-row">
        <input id="input" type="text" placeholder="Digite sua pergunta..." />
        <button id="send">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      "Qual foi a produtividade em fevereiro?",
      "O que significa o indicador de produtividade?",
      "Como evoluiu a produtividade entre janeiro e março?",
      "Por que a produtividade caiu em fevereiro?",
      "Existe alguma relação entre produtividade e retrabalho no período?",
      "Considerando os dados disponíveis, quais recomendações você daria para a gestão?",
      "Gere um gráfico com a evolução da produtividade e do retrabalho nos últimos meses"
    ];

    const questionsEl = document.getElementById('questions');
    QUESTIONS.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = 'question-btn';
      btn.innerHTML = `<span class="num">${i + 1}</span><span>${q}</span>`;
      btn.addEventListener('click', () => ask(q));
      questionsEl.appendChild(btn);
    });

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMessage(text, role, tools, chart) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      if (tools && tools.length) {
        const t = document.createElement('div');
        t.className = 'tools-used';
        t.innerHTML = '🧰 ' + tools.map(x => `<span class="tag">${x}</span>`).join('');
        div.appendChild(t);
      }
      if (chart && chart.data && chart.data.length) {
        div.appendChild(renderChart(chart));
      }
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderChart(spec) {
      const container = document.createElement('div');
      container.className = 'chart-container';

      const title = document.createElement('div');
      title.className = 'chart-title';
      title.textContent = spec.title || 'Gráfico';
      container.appendChild(title);

      const W = 640, H = 300, padL = 50, padR = 20, padT = 20, padB = 40;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;

      // x = índice do mês, y = valor
      const labels = spec.data.map(d => d[spec.xField]);
      const seriesList = spec.series || [];
      const allValues = [];
      spec.data.forEach(d => {
        seriesList.forEach(s => {
          const v = d[s.yField];
          if (v !== undefined && v !== null) allValues.push(Number(v));
        });
      });
      const minV = 0;
      const maxV = allValues.length ? Math.max(...allValues) : 0;

      const xFor = i => padL + (labels.length === 1 ? innerW / 2 : (i / (labels.length - 1)) * innerW);
      const yFor = v => padT + innerH - ((v - minV) / (maxV - minV || 1)) * innerH;

      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

      // grid + labels do eixo Y
      const yTicks = 5;
      for (let t = 0; t <= yTicks; t++) {
        const val = minV + (maxV - minV) * (t / yTicks);
        const y = yFor(val);
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
        line.setAttribute('y1', y); line.setAttribute('y2', y);
        line.setAttribute('stroke', '#334155'); line.setAttribute('stroke-width', '1');
        svg.appendChild(line);
        const txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', padL - 8); txt.setAttribute('y', y + 4);
        txt.setAttribute('text-anchor', 'end'); txt.setAttribute('font-size', '11');
        txt.setAttribute('fill', '#94a3b8');
        txt.textContent = Math.round(val);
        svg.appendChild(txt);
      }

      const defaultColors = ['#38bdf8', '#f472b6', '#4ade80', '#fbbf24', '#a78bfa'];
      const colorFor = (s, idx) => s.color || defaultColors[idx % defaultColors.length];

      const isBar = spec.chart_type === 'bar';

      seriesList.forEach((s, idx) => {
        const color = colorFor(s, idx);
        const pts = spec.data.map((d, i) => {
          const v = d[s.yField];
          return v === undefined || v === null ? null : { x: xFor(i), y: yFor(Number(v)), v: Number(v) };
        });

        if (isBar) {
          const n = labels.length;
          const groupW = innerW / n;
          const barW = groupW * 0.7 / seriesList.length;
          pts.forEach((p, i) => {
            if (!p) return;
            const x = p.x - (seriesList.length - 1) * barW / 2 + idx * barW;
            const rect = document.createElementNS(svgNS, 'rect');
            rect.setAttribute('x', x - barW / 2);
            rect.setAttribute('y', p.y);
            rect.setAttribute('width', barW);
            rect.setAttribute('height', padT + innerH - p.y);
            rect.setAttribute('fill', color);
            rect.setAttribute('rx', '2');
            svg.appendChild(rect);
          });
        } else {
          let path = '';
          pts.forEach((p, i) => {
            if (!p) return;
            path += (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ' ';
          });
          const pathEl = document.createElementNS(svgNS, 'path');
          pathEl.setAttribute('d', path.trim());
          pathEl.setAttribute('fill', 'none');
          pathEl.setAttribute('stroke', color);
          pathEl.setAttribute('stroke-width', '2.5');
          svg.appendChild(pathEl);
          pts.forEach(p => {
            if (!p) return;
            const c = document.createElementNS(svgNS, 'circle');
            c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
            c.setAttribute('r', '4'); c.setAttribute('fill', color);
            svg.appendChild(c);
          });
        }
      });

      // labels do eixo X
      labels.forEach((lab, i) => {
        const txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', xFor(i)); txt.setAttribute('y', H - 15);
        txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('font-size', '11');
        txt.setAttribute('fill', '#e2e8f0');
        txt.textContent = lab;
        svg.appendChild(txt);
      });

      container.appendChild(svg);

      // legenda
      const legend = document.createElement('div');
      legend.className = 'chart-legend';
      seriesList.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        const swatch = document.createElement('span');
        swatch.className = 'legend-swatch';
        swatch.style.background = colorFor(s, idx);
        item.appendChild(swatch);
        item.appendChild(document.createTextNode(s.label || s.yField));
        legend.appendChild(item);
      });
      container.appendChild(legend);

      return container;
    }

    function addLoading() {
      const div = document.createElement('div');
      div.className = 'loading';
      div.id = 'loading';
      div.textContent = 'Pensando...';
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function removeLoading() {
      const el = document.getElementById('loading');
      if (el) el.remove();
    }

    async function ask(question) {
      addMessage(question, 'user');
      inputEl.value = '';
      addLoading();
      sendBtn.disabled = true;
      try {
        const res = await fetch('/agent/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        if (!res.ok) {
          addMessage('Erro: ' + (data.detail || res.statusText), 'agent');
        } else {
          addMessage(data.answer, 'agent', data.tools_used, data.chart);
        }
      } catch (err) {
        addMessage('Erro de conexão: ' + err.message, 'agent');
      } finally {
        removeLoading();
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', () => {
      const q = inputEl.value.trim();
      if (q) ask(q);
    });
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = inputEl.value.trim();
        if (q) ask(q);
      }
    });
  </script>
</body>
</html>

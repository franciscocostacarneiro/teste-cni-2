<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente Corporativo IA</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    .container { width: 100%; max-width: 820px; }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 28px; }

    .questions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }
    .question-btn {
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1.45;
      transition: all 0.18s ease;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .question-btn:hover {
      background: var(--panel-2);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .question-btn .num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chatbox {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .chatbox-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chatbox-header .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #4ade80;
    }
    #chat {
      padding: 20px;
      min-height: 160px;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #0f172a; border-bottom-right-radius: 4px; }
    .msg.agent { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
    .tools-used { font-size: 0.75rem; color: var(--muted); margin-top: 8px; opacity: 0.85; }
    .tools-used .tag {
      display: inline-block;
      background: rgba(129, 140, 248, 0.18);
      color: #a5b4fc;
      padding: 2px 8px;
      border-radius: 20px;
      margin-right: 5px;
    }
    .loading { align-self: center; color: var(--muted); font-style: italic; }
    .input-row { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0f172a;
      border: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #send:hover { opacity: 0.9; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Assistente Corporativo IA</h1>
    <p class="subtitle">Análise de indicadores de produtividade e retrabalho</p>

    <div class="questions" id="questions"></div>

    <div class="chatbox">
      <div class="chatbox-header"><span class="dot"></span> Conversa com o agente</div>
      <div id="chat"></div>
      <div class="input-row">
        <input id="input" type="text" placeholder="Digite sua pergunta..." />
        <button id="send">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      "Qual foi a produtividade em fevereiro?",
      "O que significa o indicador de produtividade?",
      "Como evoluiu a produtividade entre janeiro e março?",
      "Por que a produtividade caiu em fevereiro?",
      "Existe alguma relação entre produtividade e retrabalho no período?",
      "Considerando os dados disponíveis, quais recomendações você daria para a gestão?"
    ];

    const questionsEl = document.getElementById('questions');
    QUESTIONS.forEach((q, i) => {
      const btn = document.createElement('button');
      btn.className = 'question-btn';
      btn.innerHTML = `<span class="num">${i + 1}</span><span>${q}</span>`;
      btn.addEventListener('click', () => ask(q));
      questionsEl.appendChild(btn);
    });

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMessage(text, role, tools) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      if (tools && tools.length) {
        const t = document.createElement('div');
        t.className = 'tools-used';
        t.innerHTML = '🧰 ' + tools.map(x => `<span class="tag">${x}</span>`).join('');
        div.appendChild(t);
      }
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addLoading() {
      const div = document.createElement('div');
      div.className = 'loading';
      div.id = 'loading';
      div.textContent = 'Pensando...';
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function removeLoading() {
      const el = document.getElementById('loading');
      if (el) el.remove();
    }

    async function ask(question) {
      addMessage(question, 'user');
      inputEl.value = '';
      addLoading();
      sendBtn.disabled = true;
      try {
        const res = await fetch('/agent/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        if (!res.ok) {
          addMessage('Erro: ' + (data.detail || res.statusText), 'agent');
        } else {
          addMessage(data.answer, 'agent', data.tools_used);
        }
      } catch (err) {
        addMessage('Erro de conexão: ' + err.message, 'agent');
      } finally {
        removeLoading();
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', () => {
      const q = inputEl.value.trim();
      if (q) ask(q);
    });
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = inputEl.value.trim();
        if (q) ask(q);
      }
    });
  </script>
</body>
</html>
